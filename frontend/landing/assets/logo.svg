<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="buksuEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Outer Arch Ring -->
    <path d="M 230 840 A 420 420 0 1 1 770 840" 
          stroke="url(#buksuEmblemGrad)" 
          stroke-width="54" 
          stroke-linecap="round" 
          fill="none" />

    <!-- Head Circle -->
    <circle cx="500" cy="385" r="86" 
            stroke="url(#buksuEmblemGrad)" 
            stroke-width="54" 
            fill="none" />

    <!-- Core Pill Loop (Mentee Node) -->
    <rect x="424" y="525" width="152" height="315" rx="76" 
          stroke="url(#buksuEmblemGrad)" 
          stroke-width="54" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />

    <!-- Mentor Shoulders & Arms -->
    <path d="M 240 840 C 240 670 330 510 500 510 C 670 510 760 670 760 840" 
          stroke="url(#buksuEmblemGrad)" 
          stroke-width="54" 
          stroke-linecap="round" 
          fill="none" />
  </g>
</svg>