<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PeerLink — Academic Mentoring Unit{% endblock %}</title>
  <link rel="icon" href="/static/assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script nonce="{{ csp_nonce }}">
    (function() {
      try {
        var saved = localStorage.getItem('theme');
        if (!saved) {
          var match = document.cookie.match(/(?:^|; )theme=([^;]*)/);
          if (match) saved = decodeURIComponent(match[1]);
        }
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved === 'dark' || (!saved && prefersDark) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          if (document.body) document.body.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
          if (document.body) document.body.classList.remove('dark');
        }
      } catch (_) {}
    })();
  </script>
  <style>
    :root {
      --neu-base: #ebf0f7;
      --neu-light: #ffffff;
      --neu-dark: rgba(166, 180, 200, 0.55);
      --neu-dark-strong: rgba(150, 165, 185, 0.75);
      --neu-primary: #0284c7;
      --neu-primary-hover: #0ea5e9;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
    }

    html[data-theme="dark"], html.dark {
      --neu-base: #12161f;
      --neu-light: rgba(255, 255, 255, 0.07);
      --neu-dark: rgba(0, 0, 0, 0.7);
      --neu-dark-strong: rgba(0, 0, 0, 0.88);
      --neu-primary: #0284c7;
      --neu-primary-hover: #0369a1;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      color-scheme: dark !important;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', 'DM Sans', -apple-system, system-ui, sans-serif;
      background-color: var(--neu-base);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    html[data-theme="dark"] body, html.dark body {
      background-color: #12161f !important;
      color: var(--text-main);
      color-scheme: dark !important;
    }

    .auth-page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      position: relative;
      overflow-x: hidden;
    }

    .auth-page-wrap::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(14, 165, 233, 0.08), transparent 60%);
      z-index: 0;
      pointer-events: none;
    }

    html[data-theme="dark"] .auth-page-wrap,
    html.dark .auth-page-wrap {
      background-color: #12161f !important;
    }

    html[data-theme="dark"] .auth-page-wrap::before,
    html.dark .auth-page-wrap::before {
      display: none !important;
      background: none !important;
    }

    /* Neumorphic compact Back button positioned outside the auth card */
    .auth-neu-back-btn {
      position: fixed;
      top: 20px;
      left: 24px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      background-color: #ebf0f7;
      color: #334155;
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 3px 3px 8px rgba(166, 180, 200, 0.6), -3px -3px 8px #ffffff;
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      line-height: 1;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }

    .auth-neu-back-btn:hover {
      color: #0f172a;
      transform: translateY(-1px);
      box-shadow: 5px 5px 12px rgba(166, 180, 200, 0.7), -5px -5px 12px #ffffff;
    }

    .auth-neu-back-btn:active {
      transform: translateY(1px);
      box-shadow: inset 2px 2px 5px rgba(166, 180, 200, 0.65), inset -2px -2px 5px #ffffff;
    }

    .auth-neu-back-btn:focus-visible {
      outline: 2px solid rgba(56, 189, 248, 0.8);
      outline-offset: 3px;
    }

    .auth-neu-back-icon {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      stroke-width: 2.2;
      transition: transform 0.18s ease;
      flex-shrink: 0;
    }

    .auth-neu-back-btn:hover .auth-neu-back-icon {
      transform: translateX(-2px);
    }

    @media (max-width: 640px) {
      .auth-neu-back-btn {
        top: 14px;
        left: 14px;
        height: 30px;
        padding: 0 11px;
        font-size: 11.5px;
        gap: 5px;
      }
      .auth-neu-back-icon {
        width: 12px;
        height: 12px;
      }
    }

    /* Main Extruded Neumorphic Card */
    .auth-card-standalone {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: #ebf0f7;
      border-radius: 26px;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 12px 12px 28px rgba(166, 180, 200, 0.65), -12px -12px 28px #ffffff;
      padding: 36px 32px;
      animation: auth-fade-in 0.28s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }

    @keyframes auth-fade-in {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* PeerLink Brand Lockup inside Card */
    .auth-brand-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .auth-brand-logo-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(14, 165, 233, 0.35));
    }

    .auth-brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .auth-brand-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .auth-brand-title .brand-peer {
      color: #0f172a;
    }

    .auth-brand-title .brand-link {
      color: #0284c7;
    }

    .auth-brand-subtitle {
      font-size: 0.72rem;
      font-weight: 700;
      color: #0284c7;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .auth-card-standalone h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.015em;
    }

    .auth-card-standalone .subtitle {
      margin: 0 0 22px;
      font-size: 0.9rem;
      color: var(--text-sub);
      line-height: 1.55;
    }

    .auth-card-standalone label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }

    .auth-card-standalone input[type="text"],
    .auth-card-standalone input[type="email"],
    .auth-card-standalone input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 14.5px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      background: #ebf0f7;
      color: var(--text-main);
      box-shadow: inset 3px 3px 6px rgba(166, 180, 200, 0.55), inset -3px -3px 6px #ffffff;
      font-family: inherit;
      box-sizing: border-box;
      margin-bottom: 16px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .auth-card-standalone input::placeholder {
      color: #94a3b8;
    }

    .auth-card-standalone input:focus {
      outline: none;
      border-color: var(--neu-primary);
      box-shadow: inset 2px 2px 5px rgba(166, 180, 200, 0.5), inset -2px -2px 5px #ffffff, 0 0 0 3px rgba(2, 132, 199, 0.18);
    }

    .auth-card-standalone .btn-primary {
      width: 100%;
      padding: 13px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background: #0284c7;
      border: 1px solid rgba(2, 132, 199, 0.3);
      border-radius: 14px;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      line-height: 1.2;
    }

    .auth-card-standalone .btn-primary:hover {
      background: #0369a1;
      border-color: rgba(2, 132, 199, 0.5);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
      transform: translateY(-1px);
    }

    .auth-card-standalone .btn-primary:active {
      transform: translateY(1px);
      box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.3);
    }

    .auth-card-standalone .btn-primary:disabled {
      background: #cbd5e1;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .auth-icon-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #ebf0f7;
      box-shadow: 4px 4px 10px rgba(166, 180, 200, 0.6), -4px -4px 10px #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.95);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card-standalone .auth-link {
      margin-top: 22px;
      text-align: center;
      font-size: 0.88rem;
    }

    .auth-card-standalone .auth-link a {
      color: var(--neu-primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .auth-card-standalone .auth-link a:hover {
      color: #0369a1;
      text-decoration: underline;
    }

    .auth-card-standalone .form-group {
      margin-bottom: 4px;
    }

    .auth-card-standalone .errornote {
      font-size: 0.85rem;
      color: #dc2626;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      line-height: 1.45;
    }

    .auth-card-standalone .success-note {
      font-size: 0.85rem;
      color: #059669;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      line-height: 1.45;
    }

    .auth-card-standalone ul.errorlist {
      margin: 0 0 14px;
      padding: 10px 14px 10px 28px;
      font-size: 0.82rem;
      color: #dc2626;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 12px;
    }

    .auth-card-standalone .password-strength {
      margin-top: 10px;
      margin-bottom: 16px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      background: #ebf0f7;
      box-shadow: inset 2px 2px 5px rgba(166, 180, 200, 0.45), inset -2px -2px 5px #ffffff;
    }

    .auth-card-standalone .password-strength-bar {
      height: 8px;
      border-radius: 999px;
      background: #e2e8f0;
      box-shadow: inset 1px 1px 2px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      margin-bottom: 12px;
    }

    .auth-card-standalone .password-strength-fill {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #f59e0b 0%, #10b981 100%);
      transition: width 0.22s ease;
    }

    .auth-card-standalone .password-strength-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 6px;
      font-size: 0.8rem;
    }

    .auth-card-standalone .password-strength-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      transition: color 0.15s ease;
    }

    .auth-card-standalone .password-strength-item::before {
      content: "•";
      line-height: 1;
      font-size: 16px;
      color: currentColor;
    }

    .auth-card-standalone .password-strength-item.is-valid {
      color: #059669;
      font-weight: 500;
    }

    /* Neumorphic Theme Toggle Button */
    .auth-neu-theme-btn {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      background-color: var(--neu-base);
      color: #334155;
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 3px 3px 8px rgba(166, 180, 200, 0.6), -3px -3px 8px #ffffff;
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      line-height: 1;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }

    .auth-neu-theme-btn:hover {
      color: #0284c7;
      transform: translateY(-1px);
      box-shadow: 5px 5px 12px rgba(166, 180, 200, 0.7), -5px -5px 12px #ffffff;
    }

    .auth-neu-theme-btn:active {
      transform: translateY(1px);
      box-shadow: inset 2px 2px 5px rgba(166, 180, 200, 0.65), inset -2px -2px 5px #ffffff;
    }

    .auth-neu-theme-btn:focus-visible {
      outline: 2px solid rgba(56, 189, 248, 0.8);
      outline-offset: 3px;
    }

    .auth-theme-icon-sun,
    .auth-theme-icon-moon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.2;
      flex-shrink: 0;
      transition: transform 0.18s ease;
    }

    html:not([data-theme="dark"]) .auth-theme-icon-sun { display: none; }
    html:not([data-theme="dark"]) .auth-theme-icon-moon { display: block; }
    html[data-theme="dark"] .auth-theme-icon-sun { display: block; color: #f59e0b; }
    html[data-theme="dark"] .auth-theme-icon-moon { display: none; }

    @media (max-width: 640px) {
      .auth-neu-theme-btn {
        top: 14px;
        right: 14px;
        height: 30px;
        padding: 0 11px;
        font-size: 11.5px;
        gap: 5px;
      }
      .auth-theme-icon-sun,
      .auth-theme-icon-moon {
        width: 12px;
        height: 12px;
      }
    }

    html[data-theme="dark"] .auth-card-standalone,
    html.dark .auth-card-standalone {
      background: #181b20 !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      box-shadow: 10px 10px 28px rgba(0, 0, 0, 0.65), -4px -4px 16px rgba(255, 255, 255, 0.02) !important;
    }

    /* Calibrated non-vibrant primary button in dark mode */
    html[data-theme="dark"] .auth-card-standalone .btn-primary,
    html.dark .auth-card-standalone .btn-primary {
      background: #0284c7 !important;
      color: #ffffff !important;
      border: 1px solid rgba(56, 189, 248, 0.25) !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.15) !important;
    }

    html[data-theme="dark"] .auth-card-standalone .btn-primary:hover,
    html.dark .auth-card-standalone .btn-primary:hover {
      background: #0369a1 !important;
      border-color: rgba(56, 189, 248, 0.45) !important;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.22) !important;
      transform: translateY(-1px) !important;
    }

    html[data-theme="dark"] .auth-card-standalone .btn-primary:active,
    html.dark .auth-card-standalone .btn-primary:active {
      background: #075985 !important;
      box-shadow: inset 1px 1px 4px rgba(0, 0, 0, 0.7) !important;
      transform: translateY(1px) !important;
    }

    html[data-theme="dark"] .auth-card-standalone .btn-primary:disabled,
    html.dark .auth-card-standalone .btn-primary:disabled {
      background: #1e293b !important;
      color: #64748b !important;
      border-color: rgba(255, 255, 255, 0.05) !important;
      box-shadow: none !important;
      transform: none !important;
    }

    html[data-theme="dark"] .auth-icon-circle,
    html.dark .auth-icon-circle {
      background: #14171d !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      box-shadow: inset 1.5px 1.5px 3px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0, 0, 0, 0.5) !important;
    }

    html[data-theme="dark"] .auth-neu-back-btn,
    html.dark .auth-neu-back-btn,
    html[data-theme="dark"] .auth-neu-theme-btn,
    html.dark .auth-neu-theme-btn {
      background-color: #181b20 !important;
      color: #cbd5e1 !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.5), -2px -2px 6px rgba(255, 255, 255, 0.02) !important;
    }

    html[data-theme="dark"] .auth-neu-back-btn:hover,
    html.dark .auth-neu-back-btn:hover,
    html[data-theme="dark"] .auth-neu-theme-btn:hover,
    html.dark .auth-neu-theme-btn:hover {
      color: #38bdf8 !important;
      border-color: rgba(56, 189, 248, 0.4) !important;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.85) !important;
    }

    html[data-theme="dark"] .auth-neu-back-btn:active,
    html.dark .auth-neu-back-btn:active,
    html[data-theme="dark"] .auth-neu-theme-btn:active,
    html.dark .auth-neu-theme-btn:active {
      box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.8), inset -1px -1px 4px rgba(255, 255, 255, 0.05) !important;
    }

    html[data-theme="dark"] .auth-card-standalone h1,
    html.dark .auth-card-standalone h1 {
      color: #f1f5f9;
    }

    html[data-theme="dark"] .auth-card-standalone .subtitle,
    html.dark .auth-card-standalone .subtitle {
      color: #94a3b8;
    }

    html[data-theme="dark"] .auth-brand-title .brand-peer,
    html.dark .auth-brand-title .brand-peer {
      color: #f1f5f9;
    }

    html[data-theme="dark"] .auth-card-standalone .form-group label,
    html.dark .auth-card-standalone .form-group label {
      color: #cbd5e1;
    }

    html[data-theme="dark"] .auth-card-standalone .form-group input,
    html[data-theme="dark"] .auth-card-standalone .form-group select,
    html.dark .auth-card-standalone .form-group input,
    html.dark .auth-card-standalone .form-group select {
      background-color: #12151a;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.7), inset -1px -1px 3px rgba(255, 255, 255, 0.04);
    }

    html[data-theme="dark"] .auth-card-standalone .form-group input:focus,
    html.dark .auth-card-standalone .form-group input:focus {
      border-color: #38bdf8;
      box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.7), 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    html[data-theme="dark"] .auth-card-standalone .password-rules-card,
    html.dark .auth-card-standalone .password-rules-card {
      background-color: #12151a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.6);
    }

    html[data-theme="dark"] .auth-card-standalone .password-rules-title,
    html.dark .auth-card-standalone .password-rules-title {
      color: #cbd5e1;
    }

    html[data-theme="dark"] .auth-card-standalone .password-strength-track,
    html.dark .auth-card-standalone .password-strength-track {
      background: #232832;
    }

    html[data-theme="dark"] div[style*="background: #ebf0f7"],
    html.dark div[style*="background: #ebf0f7"] {
      background: #12151a !important;
      box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.7), -3px -3px 8px rgba(255, 255, 255, 0.04) !important;
      border-color: rgba(255, 255, 255, 0.08) !important;
    }

    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>
  <a href="{% block back_url %}/app/#signin{% endblock %}" class="auth-neu-back-btn" aria-label="{% block back_label %}Back to Sign in{% endblock %}">
    <svg class="auth-neu-back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    <span>{% block back_text %}Back to Sign in{% endblock %}</span>
  </a>

  <button type="button" id="auth-theme-toggle" class="auth-neu-theme-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg class="auth-theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
    </svg>
    <svg class="auth-theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
    <span id="auth-theme-label">Dark</span>
  </button>

  <div class="auth-page-wrap">
    <div class="auth-card-standalone">
      <div class="auth-brand-lockup">
        <img
          src="/static/assets/logo_icon.png"
          alt="PeerLink Emblem"
          class="auth-brand-logo-icon"
        />
        <div class="auth-brand-text">
          <div class="auth-brand-title">
            <span class="brand-peer">Peer</span><span class="brand-link">link</span>
          </div>
          <div class="auth-brand-subtitle">Academic Mentoring Unit</div>
        </div>
      </div>

      {% if messages %}
        {% for message in messages %}
          <div class="{% if message.tags == 'error' or message.tags == 'warning' %}errornote{% else %}success-note{% endif %}" style="margin-bottom:12px;">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
      {% block content %}{% endblock %}
    </div>
  </div>

  <script nonce="{{ csp_nonce }}">
    (function() {
      function evaluatePassword(value) {
        return {
          length: value.length >= 10,
          number: /[0-9]/.test(value),
          special: /[^A-Za-z0-9]/.test(value),
        };
      }

      function updateWidget(widget) {
        const form = widget.closest("form");
        if (!form) return;

        const passwordInput = form.querySelector('input[type="password"]');
        const submitButton = form.querySelector('button[type="submit"]');
        if (!passwordInput) return;

        const value = passwordInput.value || "";
        const rules = evaluatePassword(value);
        const entries = ["length", "number", "special"];
        let passed = 0;

        entries.forEach((rule) => {
          const element = widget.querySelector(`[data-rule="${rule}"]`);
          if (!element) return;

          const isValid = !!rules[rule];
          element.classList.toggle("is-valid", isValid);
          element.classList.toggle("is-invalid", !isValid);
          passed += isValid ? 1 : 0;
        });

        const fill = widget.querySelector("[data-password-strength-fill]");
        if (fill) {
          fill.style.width = `${Math.round((passed / entries.length) * 100)}%`;
        }

        if (submitButton) {
          submitButton.disabled = passed < entries.length;
        }
      }

      function initPasswordWidgets() {
        document.querySelectorAll("[data-password-strength]").forEach((widget) => {
          const form = widget.closest("form");
          if (!form) return;

          const passwordInput = form.querySelector('input[type="password"]');
          if (!passwordInput) return;

          const refresh = () => updateWidget(widget);
          passwordInput.addEventListener("input", refresh);
          passwordInput.addEventListener("change", refresh);
          refresh();
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initPasswordWidgets);
      } else {
        initPasswordWidgets();
      }
    })();

    (function initAuthTheme() {
      const toggle = document.getElementById("auth-theme-toggle");
      const label = document.getElementById("auth-theme-label");
      function updateLabel() {
        const isDark = document.documentElement.getAttribute("data-theme") === "dark";
        if (label) label.textContent = isDark ? "Light" : "Dark";
      }
      updateLabel();

      function applyTheme(next) {
        try {
          localStorage.setItem("theme", next);
        } catch (_) {}
        try {
          document.cookie = "theme=" + next + "; path=/; max-age=31536000; SameSite=Lax";
        } catch (_) {}
        document.documentElement.setAttribute("data-theme", next);
        if (document.body) document.body.setAttribute("data-theme", next);
        if (next === "dark") {
          document.documentElement.classList.add("dark");
          if (document.body) document.body.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
          if (document.body) document.body.classList.remove("dark");
        }
        updateLabel();
      }

      if (toggle) {
        toggle.addEventListener("click", function() {
          const isDark = document.documentElement.getAttribute("data-theme") === "dark";
          const next = isDark ? "light" : "dark";
          applyTheme(next);
        });
      }

      window.addEventListener("storage", function(e) {
        if (e.key === "theme" && (e.newValue === "dark" || e.newValue === "light")) {
          applyTheme(e.newValue);
        }
      });
    })();
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
